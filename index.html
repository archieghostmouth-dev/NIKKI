<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>日記 · nikki</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--bg:#fbfbf9;--ink:#111;--mid:#a5a29a;--faint:#e7e4dd;--red:#e1261c;
  --mono:'M PLUS 1 Code','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,ui-monospace,monospace;}
body{font-family:var(--mono);color:var(--ink);background:var(--bg);min-height:100vh;font-size:13px;line-height:1.7;
  letter-spacing:.01em;-webkit-font-smoothing:antialiased;padding:40px 16px calc(30px + env(safe-area-inset-bottom));}
.wrap{max-width:520px;margin:0 auto;}
.center{text-align:center;}
.lbl{text-transform:uppercase;letter-spacing:.2em;font-size:10px;color:var(--mid);}
.sep{color:var(--mid);text-align:center;letter-spacing:.4em;margin:26px 0;user-select:none;}
.lk{cursor:pointer;text-decoration:none;border:none;background:none;color:var(--ink);font:inherit;text-transform:uppercase;letter-spacing:.14em;font-size:11px;padding:0;}
.lk:hover{text-decoration:underline;}.lk.mid{color:var(--mid);}.lk.red{color:var(--red);}
.lk:disabled{color:var(--mid);cursor:default;text-decoration:none;}
.primary{cursor:pointer;border:none;background:var(--ink);color:var(--bg);font:inherit;text-transform:uppercase;letter-spacing:.16em;font-size:11px;padding:9px 16px;}
.primary:active{background:var(--red);}.primary:disabled{background:var(--faint);color:var(--mid);cursor:default;}
textarea,input[type=text],input[type=password]{width:100%;border:1px solid var(--ink);background:var(--bg);color:var(--ink);padding:12px 14px;font-family:var(--mono);font-size:16px;line-height:1.9;resize:vertical;}
textarea:focus,input:focus{outline:none;border-color:var(--red);}
.lv{cursor:pointer;font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;border:none;background:none;color:var(--mid);padding:3px 7px;}
.lv.on{color:var(--ink);text-decoration:underline;text-underline-offset:3px;}
.tchip{display:inline-block;font-size:12px;padding:3px 7px;margin:3px;border:1px solid var(--faint);}
.tchip .m{color:var(--mid);font-size:10px;}
.tchip.hit{background:var(--ink);color:var(--bg);border-color:var(--ink);}.tchip.hit .m{color:var(--bg);opacity:.7;}
.barwrap{height:4px;background:var(--faint);}.barfill{height:100%;background:var(--ink);}
.streaknum{font-size:46px;font-weight:700;line-height:1;}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;max-width:300px;margin:14px auto 0;}
.cell{aspect-ratio:1;border:1px solid var(--faint);}
.cell.on{background:var(--ink);border-color:var(--ink);}
.cell.frz{position:relative;}.cell.frz::after{content:"";position:absolute;inset:2px;background:var(--ink);}
.cell.today{border-color:var(--red);}
svg.spr,img.spr{image-rendering:pixelated;display:block;}
.garden{display:flex;flex-wrap:wrap;gap:14px 16px;justify-content:center;align-items:flex-end;}
.gcell{position:relative;cursor:pointer;}
.bubble{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:8px;background:var(--bg);border:1px solid var(--ink);padding:8px 10px;width:210px;z-index:20;text-align:left;}
.bubble .d{font-size:9px;color:var(--mid);letter-spacing:.1em;margin-bottom:4px;}.bubble .s{font-size:13px;line-height:1.7;}
.gcell:hover .bubble,.gcell:focus-within .bubble{display:block;}
.box{border:1px solid var(--ink);padding:16px;}
.marq{overflow:hidden;border-top:1px solid var(--faint);margin-top:26px;padding-top:10px;}
.marqin{white-space:nowrap;display:inline-block;color:var(--mid);font-size:10px;letter-spacing:.24em;animation:marq 22s linear infinite;}
@keyframes marq{from{transform:translateX(0);}to{transform:translateX(-50%);}}
@keyframes wob{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0);}25%{transform:translateX(-3px) rotate(-9deg);}75%{transform:translateX(3px) rotate(9deg);}}
@keyframes pop{0%{transform:scale(0) rotate(-16deg);}70%{transform:scale(1.25);}100%{transform:scale(1);}}
@keyframes flash{0%,100%{opacity:0;}40%{opacity:.9;}}
.egg{animation:wob 2.8s ease-in-out infinite;transform-origin:50% 92%;}
.egg.hatch{animation:shake .09s linear 9;}
.pop{animation:pop .45s ease both;}
.flash{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:9999;animation:flash .4s ease;}
@media (prefers-reduced-motion:reduce){.egg,.egg.hatch,.pop,.flash,.marqin{animation:none;}}
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useCallback}=React;

/* ---- auth-scoped API ---- */
const AUTH={secret:localStorage.getItem("nikki_secret")||""};
async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{...(opts.headers||{}),"x-app-secret":AUTH.secret}});
  if(r.status===401){const e=new Error("unauthorized");e.code=401;throw e;}
  return r;
}
async function callClaude(system,user){
  const r=await api("/api/claude",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({system,messages:[{role:"user",content:user}]})});
  const data=await r.json();
  const t=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
  return JSON.parse(t.replace(/```json/gi,"").replace(/```/g,"").trim());
}
async function loadState(){const r=await api("/api/state");return r.json();}
let saveTimer=null,blob={};
function saveState(patch){blob={...blob,...patch};clearTimeout(saveTimer);saveTimer=setTimeout(()=>{api("/api/state",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(blob)}).catch(()=>{});},600);}

/* ---- romaji → hiragana ---- */
const K={a:"あ",i:"い",u:"う",e:"え",o:"お",ka:"か",ki:"き",ku:"く",ke:"け",ko:"こ",ga:"が",gi:"ぎ",gu:"ぐ",ge:"げ",go:"ご",sa:"さ",si:"し",shi:"し",su:"す",se:"せ",so:"そ",za:"ざ",zi:"じ",ji:"じ",zu:"ず",ze:"ぜ",zo:"ぞ",ta:"た",ti:"ち",chi:"ち",tu:"つ",tsu:"つ",te:"て",to:"と",da:"だ",di:"ぢ",du:"づ",de:"で",do:"ど",na:"な",ni:"に",nu:"ぬ",ne:"ね",no:"の",ha:"は",hi:"ひ",hu:"ふ",fu:"ふ",he:"へ",ho:"ほ",ba:"ば",bi:"び",bu:"ぶ",be:"べ",bo:"ぼ",pa:"ぱ",pi:"ぴ",pu:"ぷ",pe:"ぺ",po:"ぽ",ma:"ま",mi:"み",mu:"む",me:"め",mo:"も",ya:"や",yu:"ゆ",yo:"よ",ra:"ら",ri:"り",ru:"る",re:"れ",ro:"ろ",wa:"わ",wo:"を",vu:"ゔ",kya:"きゃ",kyu:"きゅ",kyo:"きょ",gya:"ぎゃ",gyu:"ぎゅ",gyo:"ぎょ",sha:"しゃ",shu:"しゅ",sho:"しょ",sya:"しゃ",syu:"しゅ",syo:"しょ",ja:"じゃ",ju:"じゅ",jo:"じょ",jya:"じゃ",jyu:"じゅ",jyo:"じょ",cha:"ちゃ",chu:"ちゅ",cho:"ちょ",tya:"ちゃ",tyu:"ちゅ",tyo:"ちょ",nya:"にゃ",nyu:"にゅ",nyo:"にょ",hya:"ひゃ",hyu:"ひゅ",hyo:"ひょ",bya:"びゃ",byu:"びゅ",byo:"びょ",pya:"ぴゃ",pyu:"ぴゅ",pyo:"ぴょ",mya:"みゃ",myu:"みゅ",myo:"みょ",rya:"りゃ",ryu:"りゅ",ryo:"りょ",fa:"ふぁ",fi:"ふぃ",fe:"ふぇ",fo:"ふぉ","-":"ー",".":"。",",":"、","?":"？","!":"！","~":"〜"};
function toKana(src){let out="",i=0;while(i<src.length){const c=src[i];if(!/[a-zA-Z'\-.,?!~]/.test(c)){out+=c;i++;continue;}const seg=src.slice(i).toLowerCase();if(seg.startsWith("tch")){out+="っ";i++;continue;}if(/^([bcdfghjkmprstvwz])\1/.test(seg)){out+="っ";i++;continue;}if(seg[0]==="n"){if(seg[1]==="'"){out+="ん";i+=2;continue;}if(seg[1]==="n"){out+="ん";i+=2;continue;}if(seg[1]&&!/[aiueoy]/.test(seg[1])){out+="ん";i++;continue;}if(i===src.length-1){out+="n";i++;continue;}}let hit=false;for(const len of[3,2,1]){const s=seg.slice(0,len);if(K[s]){out+=K[s];i+=len;hit=true;break;}}if(!hit){out+=c;i++;}}return out;}

/* ---- built-in critters ---- */
const TPL=[["........","..oooo..",".obbbbo.","obbbbbbo","obebbebo","obbbbbbo",".obbbbo.","..oooo.."],["...o....","..obo...",".obbbbo.","obebbebo","obbaabbo","obbbbbbo",".obbbbo.","..o..o.."],[".o....o.","obo..obo","obbbbbbo","obebbebo","obbbbbbo","obbaabbo",".obbbbo.","..o..o.."],["o......o",".o....o.","..obbo..",".obebeo.",".obbbbo.",".oabbao.",".obbbbo.","..o..o.."],["...oo...","..obbo..",".obbbbo.","obbllbbo","obebbebo","obbbbbbo",".obbbbo.","..oooo.."],["...aa...","..aaaa..","...o....","..obbo..",".obebeo.",".obbbbo.",".obbbbo.","..oooo.."],["..oooo..",".obbbbo.","obwbbwbo","obebbebo","obbbbbbo","obbbbbbo","obbbbbbo","o.o.o.o."],["...oo...","...bb...",".obbbbo.","obbbbbbo",".obebeo.","..obbo..",".o.bb.o.","o..oo..o"],["........","..oooo..",".obllbo.","obllllbo","obebbebo","obbaabbo",".obbbbo.","..oooo.."],["..oooo..",".obbbbo.","obwbbwbo","oobbbboo","...bb...","..obbo..","..obbo..","..oooo.."]];
const HUES=[265,210,150,45,12,335,95,185,320,55];
function palFor(sid,special){const h=HUES[sid%HUES.length],s=special?52:38;return{b:`hsl(${h},${s}%,66%)`,o:`hsl(${h},${s-6}%,40%)`,l:`hsl(${h},${s}%,85%)`,a:`hsl(${(h+40)%360},${s+8}%,60%)`};}
const pad4=n=>String(n).padStart(4,"0");
const packUrl=(base,sid)=>base.replace(/\/+$/,"")+"/"+pad4(sid)+".gif";
function BuiltIn({sid,special,px}){const rows=TPL[sid%TPL.length],p=palFor(sid,special),cm={o:p.o,b:p.b,l:p.l,a:p.a,e:"#111",w:"#fff"},rc=[];rows.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!==".")rc.push(<rect key={x+"-"+y} x={x} y={y} width="1" height="1" fill={cm[ch]||p.b}/>);}));return <div style={{position:"relative",display:"inline-block"}}>{special&&<div style={{position:"absolute",inset:-3,border:"1px solid var(--red)"}}/>}<svg className="spr" width={8*px} height={8*px} viewBox="0 0 8 8">{rc}</svg></div>;}
function Creature({c,pack,px}){const[err,setErr]=useState(false);const sid=c.sid||1;if(pack&&pack.base&&!err)return <img className="spr" alt="" src={packUrl(pack.base,sid)} width={px*8} height={px*8} style={{objectFit:"contain"}} onError={()=>setErr(true)}/>;return <BuiltIn sid={sid} special={c.special} px={px}/>;}
function EggView({hatch,pack}){if(pack&&pack.egg)return <img className={"spr egg"+(hatch?" hatch":"")} alt="egg" src={pack.egg} width={54} height={54} style={{objectFit:"contain"}}/>;const rows=["...oo...","..obbo..",".obllbo.","obbwbbbo","obbbbbbo","obbwbbbo","obbbbwbo",".obbbbo.","..oooo..","...oo..."],cm={o:"#111",b:"#d8d5cd",l:"#fff",w:"#b3afa4"},rc=[];rows.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!==".")rc.push(<rect key={x+"-"+y} x={x} y={y} width="1" height="1" fill={cm[ch]}/>);}));return <svg className={"spr egg"+(hatch?" hatch":"")} width={8*6} height={10*6} viewBox="0 0 8 10">{rc}</svg>;}

/* ---- dates ---- */
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const parseD=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const diffDays=(a,b)=>Math.round((parseD(a)-parseD(b))/86400000);
const LEVELS=["N5","N4","N3","N2","N1"];
const ANGLES=["something small you noticed","a conversation you had","something that annoyed you","a plan for tomorrow","a memory this stirred","how your energy felt","food today","something you're looking forward to","a tiny win","weather and mood","a person you saw","a decision you made"];

function Diary({initial}){
  const [level,setLevel]=useState(initial.level||"N5");
  const [romaji,setRomaji]=useState(initial.romaji!==false);
  const [known,setKnown]=useState(initial.known||null);
  const [aboutMe,setAboutMe]=useState(initial.aboutMe||"");
  const [pack,setPack]=useState(initial.pack||null);
  const [entries,setEntries]=useState(initial.entries||{});
  const [frozen,setFrozen]=useState(initial.frozen||[]);
  const [gstats,setGstats]=useState(initial.gstats||{});
  const [daily,setDaily]=useState(initial.daily||null);
  const [input,setInput]=useState("");
  const [feedback,setFeedback]=useState(null);
  const [checking,setChecking]=useState(false);
  const [error,setError]=useState("");
  const [hatching,setHatching]=useState(false);
  const [flash,setFlash]=useState(false);
  const [practice,setPractice]=useState(false);
  const [showTune,setShowTune]=useState(false);
  const [importError,setImportError]=useState("");
  const taRef=useRef(null);
  const td=today();

  // freeze reconciliation once/day
  useEffect(()=>{
    const dates=Object.keys(entries).sort();
    if(dates.length&&initial.recon!==td){
      const last=dates[dates.length-1],missed=diffDays(td,last)-1,avail=Math.floor(dates.length/7)-frozen.length;
      if(missed>0&&missed<=avail){const nf=[...frozen];for(let i=1;i<=missed;i++)nf.push(addDays(last,i));setFrozen(nf);saveState({frozen:nf,recon:td});}
      else saveState({recon:td});
    }
  },[]); // eslint-disable-line

  const kGrammar=known?(known.grammar||[]):[];
  const kVocab=known?(known.vocab||[]).map(x=>x.text):[];
  function pickTargets(){if(!kGrammar.length)return[];const sc=kGrammar.map(g=>{const s=gstats[g.text]||{};return{g,u:s.used||0,l:s.last||"0000",r:Math.random()};});sc.sort((a,b)=>a.u-b.u||(a.l<b.l?-1:a.l>b.l?1:0)||a.r-b.r);return sc.slice(0,3).map(x=>({text:x.g.text,meaning:x.g.meaning}));}

  useEffect(()=>{(async()=>{
    if(daily&&daily.date===td)return;
    const targets=pickTargets(),angle=ANGLES[(Math.random()*ANGLES.length)|0];
    let nudge="Write a line or two about your day.";
    try{const ask=Math.random()<0.4;const j=await callClaude(`Write one warm one-line diary nudge (English) for a JLPT ${level} learner keeping a daily Japanese journal. Return ONLY {"nudge":string}.${aboutMe.trim()?` Learner: ${aboutMe.trim()}.`:""} Theme: ${angle}.${targets.length?` Invite them to use naturally: ${targets.map(t=>t.text).join("、")}.`:""}${ask?" Make it a friendly question about their own life.":""} One sentence, encouraging, not corny.`,"nudge");if(j.nudge)nudge=j.nudge;}catch{}
    const d={date:td,targets,nudge};setDaily(d);saveState({daily:d});
  })();},[known,level]); // eslint-disable-line

  const dates=Object.keys(entries);
  const active=new Set([...dates,...frozen]);
  const todayDone=!!entries[td];
  const streak=(()=>{let c=active.has(td)?td:addDays(td,-1);if(!active.has(c))return 0;let n=0;while(active.has(c)){n++;c=addDays(c,-1);}return n;})();
  const longest=(()=>{const all=[...active].sort();let best=0,run=0,prev=null;for(const d of all){if(prev&&diffDays(d,prev)===1)run++;else run=1;best=Math.max(best,run);prev=d;}return best;})();
  const freezes=Math.max(0,Math.floor(dates.length/7)-frozen.length);

  const onType=e=>{const v=e.target.value;if(romaji){setInput(toKana(v));requestAnimationFrame(()=>{const el=taRef.current;if(el)el.selectionStart=el.selectionEnd=el.value.length;});}else setInput(v);};

  const check=async()=>{
    if(!input.trim()||checking)return;setChecking(true);setError("");setFeedback(null);
    const targets=daily?.targets||[];
    try{
      const sys=`You are a precise, encouraging Japanese diary tutor. Learner is JLPT ${level}. Today's nudge: "${daily?.nudge||""}". They wrote a diary line in Japanese.
Return ONLY minified JSON: corrected(natural correct version of intent), matched(bool), rubric({grammar:0-5,naturalness:0-5,scope:0-5}), notes(array up to 3 {span,fix,why}), suggestion(one richer natural alternative or ""), encouragement(one honest line), targets(array — for EACH target below: {point, used(bool used correctly), note}).
Targets: ${targets.length?targets.map(t=>t.text).join("、"):"(none)"}.
Never invent errors; many phrasings valid. Japanese in Japanese, English explanations.${known?` They studied these; build feedback from them, flag reaching beyond.\nGRAMMAR: ${kGrammar.map(x=>x.text).join("、")}\nVOCAB(${kVocab.length}): ${kVocab.join("、")}`:""}`;
      const j=await callClaude(sys,input.trim());
      setFeedback(j);
      if(targets.length){const ng={...gstats};targets.forEach(t=>{const hit=(j.targets||[]).find(x=>x.point===t.text);const s=ng[t.text]||{used:0};ng[t.text]={used:s.used+(hit&&hit.used?1:0),last:td};});setGstats(ng);saveState({gstats:ng});}
      if(!practice&&!todayDone)recordDay(input.trim(),j);
    }catch(e){setError("Couldn't read that one. Try again in a moment.");}
    finally{setChecking(false);}
  };

  const recordDay=(text,j)=>{setHatching(true);setTimeout(()=>{setFlash(true);setTimeout(()=>setFlash(false),400);const special=(streak+1)%7===0||(dates.length+1)%10===0;const sid=1+((Math.random()*251)|0);const entry={text,corrected:j.corrected,ts:Date.now(),targets:(j.targets||[]),sid,special};const ne={...entries,[td]:entry};setEntries(ne);saveState({entries:ne});setHatching(false);},820);};

  const importKnown=async file=>{setImportError("");try{const j=JSON.parse(await file.text());if(!Array.isArray(j.grammar)&&!Array.isArray(j.vocab))throw 0;const clean={grammar:j.grammar||[],vocab:j.vocab||[],exported_at:j.exported_at||null};setKnown(clean);saveState({known:clean});setDaily(null);}catch{setImportError("Expected a known.json like { grammar:[...], vocab:[...] }.");}};

  const setLvl=lv=>{setLevel(lv);saveState({level:lv});};
  const setRom=r=>{setRomaji(r);saveState({romaji:r});};
  const setAbout=v=>{setAboutMe(v);saveState({aboutMe:v});};
  const savePack=(base,egg)=>{const p={base:base||"",egg:egg||""};setPack(p);saveState({pack:p});};

  const Bar=({jp,en,v})=>(<div style={{display:"flex",alignItems:"center",gap:8,margin:"4px 0"}}><div style={{width:120,fontSize:11}}>{jp} <span style={{color:"var(--mid)"}}>{en}</span></div><div className="barwrap" style={{flex:1}}><div className="barfill" style={{width:`${Math.max(0,Math.min(5,v))/5*100}%`}}/></div><div style={{width:24,textAlign:"right",fontSize:10,color:"var(--mid)"}}>{v}/5</div></div>);

  const heat=[];for(let i=27;i>=0;i--){const d=addDays(td,-i);heat.push({d,on:!!entries[d],frz:frozen.includes(d),today:d===td});}
  const garden=Object.keys(entries).sort().map(d=>({d,...entries[d]}));
  const todayEntry=entries[td];

  return(<div className="wrap">
    {flash&&<div className="flash"/>}
    <div className="center"><div style={{fontSize:24,letterSpacing:".1em"}}>日記</div><div className="lbl" style={{marginTop:6}}>a sentence a day</div></div>
    <div className="center" style={{margin:"28px 0 4px"}}><div className="streaknum" style={{color:streak>0?"var(--ink)":"var(--mid)"}}>{streak}</div><div className="lbl" style={{marginTop:8}}>day streak</div><div style={{fontSize:11,color:"var(--mid)",marginTop:10}}>longest {longest} · {freezes} freeze{freezes===1?"":"s"} banked</div></div>
    <div className="heat">{heat.map(c=><div key={c.d} className={"cell"+(c.on?" on":"")+(c.frz?" frz":"")+(c.today?" today":"")} title={c.d}/>)}</div>
    <div className="sep">— — —</div>
    <div className="center" style={{display:"flex",gap:2,justifyContent:"center",flexWrap:"wrap",alignItems:"center"}}>{LEVELS.map(lv=><button key={lv} className={"lv"+(lv===level?" on":"")} onClick={()=>setLvl(lv)}>{lv}</button>)}<span style={{color:"var(--faint)"}}>|</span><button className={"lv"+(romaji?" on":"")} onClick={()=>setRom(!romaji)}>{romaji?"あ romaji":"romaji off"}</button></div>
    <div style={{marginTop:22}}>
      <div className="center lbl">{new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})}</div>
      {todayDone&&!practice?(
        <div className="center" style={{marginTop:16}}>
          <div className="lk red" style={{cursor:"default"}}>✓ entry logged</div>
          {todayEntry&&<div style={{fontSize:16,margin:"14px 0",lineHeight:1.8}}>{todayEntry.corrected}</div>}
          {todayEntry&&<div style={{display:"flex",justifyContent:"center",margin:"16px 0"}}><div className="pop"><Creature c={todayEntry} pack={pack} px={7}/></div></div>}
          <div style={{fontSize:11,color:"var(--mid)"}}>come back tomorrow to keep the streak</div>
          <div style={{marginTop:14}}><button className="lk mid" onClick={()=>{setPractice(true);setFeedback(null);setInput("");}}>practice more (no hatch) &gt;&gt;&gt;</button></div>
        </div>
      ):(<>
        <div className="center" style={{fontSize:14,margin:"12px 0 16px",lineHeight:1.7}}>{daily?daily.nudge:"…"}{practice&&<span style={{color:"var(--mid)"}}> · extra practice</span>}</div>
        {daily&&daily.targets.length>0&&<div className="center" style={{marginBottom:16}}><div className="lbl" style={{marginBottom:7}}>today, try to use</div>{daily.targets.map(t=><span key={t.text} className="tchip">{t.text} <span className="m">{t.meaning}</span></span>)}</div>}
        {!known&&<div className="center" style={{fontSize:11,color:"var(--mid)",marginBottom:14}}>import your bunpro set (tune, below) for daily grammar targets</div>}
        <div style={{display:"flex",gap:14,alignItems:"flex-start"}}>
          <div style={{flex:1}}>
            <textarea ref={taRef} rows={3} value={input} onChange={onType} onKeyDown={e=>{if((e.metaKey||e.ctrlKey)&&e.key==="Enter")check();}} placeholder={romaji?"type romaji — kyou wa…":"今日は…"}/>
            <div style={{display:"flex",alignItems:"center",gap:14,marginTop:12}}><button className="primary" onClick={check} disabled={checking||!input.trim()}>{checking?"reading…":practice?"check":"log today"}</button><span style={{fontSize:10,color:"var(--mid)"}}>⌘/Ctrl+↵</span>{practice&&<button className="lk mid" onClick={()=>setPractice(false)}>back</button>}</div>
          </div>
          {!practice&&<div style={{width:60,textAlign:"center",flexShrink:0}}><EggView hatch={hatching} pack={pack}/><div className="lbl" style={{marginTop:6,fontSize:8}}>{hatching?"!!!":"egg"}</div></div>}
        </div>
        {error&&<div style={{color:"var(--red)",fontSize:12,marginTop:10}}>{error}</div>}
      </>)}
    </div>
    {feedback&&(<div className="box" style={{marginTop:22}}>
      <div className="lbl">feedback</div>
      <div style={{fontSize:12,margin:"8px 0 12px",color:feedback.matched?"var(--ink)":"var(--red)"}}>{feedback.matched?"✓ それで伝わります":"なおすところがあります"}</div>
      <div className="lbl">natural version</div>
      <div style={{fontSize:18,lineHeight:1.7,borderBottom:"2px solid var(--ink)",display:"inline-block",margin:"6px 0 16px"}}>{feedback.corrected}</div>
      {feedback.rubric&&<div style={{marginBottom:16}}><Bar jp="文法" en="grammar" v={feedback.rubric.grammar}/><Bar jp="自然さ" en="natural" v={feedback.rubric.naturalness}/><Bar jp="範囲" en={`${level} scope`} v={feedback.rubric.scope}/></div>}
      {Array.isArray(feedback.targets)&&feedback.targets.length>0&&<div style={{marginBottom:16}}><div className="lbl" style={{marginBottom:7}}>grammar targets</div>{feedback.targets.map((t,i)=><span key={i} className={"tchip"+(t.used?" hit":"")}>{t.point} <span className="m">{t.used?"✓":"—"}</span></span>)}</div>}
      {Array.isArray(feedback.notes)&&feedback.notes.length>0&&<div style={{marginBottom:14}}>{feedback.notes.map((n,i)=><div key={i} style={{padding:"7px 0",borderTop:i?"1px solid var(--faint)":"none",fontSize:13}}>{n.span?<span style={{textDecoration:"line-through",color:"var(--mid)"}}>{n.span}</span>:null}{n.span?" → ":""}{n.fix}<div style={{color:"var(--mid)",fontSize:11}}>{n.why}</div></div>)}</div>}
      {feedback.suggestion&&<div style={{border:"1px solid var(--faint)",padding:"10px 12px",marginBottom:12}}><div className="lbl" style={{marginBottom:4}}>another way</div><div style={{fontSize:15}}>{feedback.suggestion}</div></div>}
      {feedback.encouragement&&<div style={{fontSize:13}}>{feedback.encouragement}</div>}
      <div style={{fontSize:10,color:"var(--mid)",marginTop:12,lineHeight:1.6}}>a study aid, not a grade — japanese has many right answers and this can be off.</div>
    </div>)}
    <div className="sep">— — —</div>
    <div className="center lbl">collection · {garden.length}</div>
    {garden.length===0?<div className="center" style={{fontSize:11,color:"var(--mid)",marginTop:12}}>log today and your egg hatches. each critter keeps the sentence that made it — hover to read.</div>:<div className="garden" style={{marginTop:18}}>{garden.slice().reverse().map(e=><div key={e.d} className="gcell pop" tabIndex={0}><Creature c={e} pack={pack} px={5}/><div className="bubble"><div className="d">{e.d}</div><div className="s">{e.corrected||e.text}</div></div></div>)}</div>}
    <div className="sep">— — —</div>
    <div className="center"><button className="lk mid" onClick={()=>setShowTune(s=>!s)}>{showTune?"tune ▾":"tune ▸"}</button></div>
    {showTune&&<div className="box" style={{marginTop:16}}>
      <div className="lbl">bunpro known set</div>
      {known?(<div style={{display:"flex",alignItems:"center",gap:10,margin:"8px 0 16px"}}><div style={{fontSize:12,flex:1}}>tuned to {kGrammar.length} grammar + {kVocab.length} vocab{known.exported_at&&<span style={{color:"var(--mid)"}}> · {new Date(known.exported_at).toLocaleDateString()}</span>}</div><button className="lk red" onClick={()=>{setKnown(null);saveState({known:null});}}>remove</button></div>):<div style={{margin:"8px 0 4px"}}><label className="lk"><span style={{textDecoration:"underline"}}>import known.json &gt;&gt;&gt;</span><input type="file" accept=".json,application/json" style={{display:"none"}} onChange={e=>{const f=e.target.files&&e.target.files[0];if(f)importKnown(f);}}/></label></div>}
      {importError&&<div style={{color:"var(--red)",fontSize:11,marginBottom:8}}>{importError}</div>}
      <div className="box" style={{margin:"12px 0 16px",borderColor:"var(--faint)"}}><div className="lbl" style={{marginBottom:8}}>how to sync from bunpro</div><ol style={{margin:0,paddingLeft:16,fontSize:12,lineHeight:1.8}}><li>install tampermonkey, add the bunpro-export userscript</li><li>open bunpro.jp logged in → click ⬇ export known.json (bottom-right)</li><li>back here → import known.json above. it syncs to all your devices.</li><li style={{color:"var(--mid)"}}>no tampermonkey? paste the console version into bunpro's dev console.</li></ol></div>
      <div className="lbl" style={{marginBottom:8}}>sprite pack (optional)</div>
      <div style={{fontSize:11,color:"var(--mid)",marginBottom:8,lineHeight:1.6}}>your own creature sprites: set a base URL where <b>0001.gif … 0251.gif</b> live. blank = built-in critters.</div>
      <input type="text" defaultValue={pack?.base||""} placeholder="https://your-site.com/sprites" onBlur={e=>savePack(e.target.value,pack?.egg)} style={{marginBottom:8,fontSize:12}}/>
      <input type="text" defaultValue={pack?.egg||""} placeholder="egg image URL (optional)" onBlur={e=>savePack(pack?.base,e.target.value)} style={{marginBottom:6,fontSize:12}}/>
      {pack&&(pack.base||pack.egg)&&<button className="lk red" onClick={()=>{setPack(null);saveState({pack:null});}}>clear pack</button>}
      <div className="lbl" style={{margin:"16px 0 8px"}}>about you</div>
      <input type="text" defaultValue={aboutMe} onBlur={e=>setAbout(e.target.value)} placeholder="e.g. i make electronic music, love ramen & cats" style={{fontSize:12}}/>
      <div style={{fontSize:11,color:"var(--mid)",marginTop:6}}>tailors the daily nudge and sometimes asks about your life.</div>
    </div>}
    <div className="marq"><div className="marqin">{(streak>0?`day ${streak} · keep it alive · `:`start your streak today · `).repeat(8)}</div></div>
  </div>);
}

function App(){
  const [phase,setPhase]=useState(AUTH.secret?"loading":"gate");
  const [initial,setInitial]=useState(null);
  const [pw,setPw]=useState("");
  const [err,setErr]=useState("");
  const enter=async(secret)=>{
    AUTH.secret=secret;setPhase("loading");setErr("");
    try{const s=await loadState();blob=s||{};setInitial(blob);localStorage.setItem("nikki_secret",secret);setPhase("ready");}
    catch(e){if(e.code===401){setErr("wrong passphrase");}else{setErr("couldn't connect — try again");}AUTH.secret="";localStorage.removeItem("nikki_secret");setPhase("gate");}
  };
  useEffect(()=>{if(AUTH.secret)enter(AUTH.secret);},[]); // eslint-disable-line
  if(phase==="ready")return <Diary initial={initial}/>;
  if(phase==="loading")return <div className="wrap center" style={{marginTop:80,color:"var(--mid)"}}>…</div>;
  return <div className="wrap center" style={{marginTop:80}}>
    <div style={{fontSize:24,letterSpacing:".1em"}}>日記</div>
    <div className="lbl" style={{margin:"8px 0 24px"}}>enter passphrase</div>
    <div style={{maxWidth:280,margin:"0 auto",textAlign:"left"}}>
      <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&pw)enter(pw);}} placeholder="passphrase" autoFocus/>
      <div style={{marginTop:12}}><button className="primary" onClick={()=>pw&&enter(pw)} disabled={!pw}>enter</button></div>
      {err&&<div style={{color:"var(--red)",fontSize:12,marginTop:10}}>{err}</div>}
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
